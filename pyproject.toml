[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-news-podcast"
version = "0.1.0"
description = "Automatically aggregates news, converts to audio, and delivers a daily podcast."
requires-python = ">=3.11"
dependencies = [
    "feedparser==6.0.11",
    "gtts==2.5.1",
    "pyttsx3==2.90",
    "pydub==0.25.1",
    "APScheduler==3.10.4",
    "pygame==2.5.2",
    "scikit-learn==1.4.2",
]

[project.scripts]
daily-news-podcast = "daily_news_podcast.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
